# onn. Streaming Device 4K pro (Walmart), Google TV, Android 14.
# Every option here was applied and verified on a real device; see tested_on.
# Streaming apps aren't listed here: [section.streaming] pulls them from
# catalog/streaming.toml, and tvlean shows only the ones installed on the TV.

[profile]
id = "onn-4k-pro"
name = "onn. Streaming Device 4K pro"
match_models = ["onn. Streaming Device 4K pro"]
tested_on = ["Android 14, jarvis, 2026-10-18"]

# --- sections, shown in this order --------------------------------------------

[section.bloat]
title = "Unused preinstalled apps"
description = "Apps that ship with the box but that nothing else needs. Turned off, they disappear from your app list, stop starting in the background and stop auto-updating, which frees up memory."

[section.privacy]
title = "Ad tracking and location"
description = "Android's built-in ad-interest system, Google's feedback reporter, and location. Turned off, apps can no longer ask the system for your ad interests or location."
caveat = "Apps still see your internet address, so region-based apps keep working. To also delete your advertising ID, go to Settings > Privacy > Ads on the TV."

[section.streaming]
catalog = "streaming"

[section.display]
title = "Screensaver and animations"
description = "What the TV shows when it's idle, and how fast menus move."

[section.launcher]
title = "Home screen"
description = "Replace the Google TV home screen, with its ads and recommendations, with a lighter launcher. The Google TV launcher stays installed, just unused."

# --- bloat ----------------------------------------------------------------------

[option.play-games]
section = "bloat"
label = "Play Games"
reason = "Google's game hub and achievements service. Only matters if you play Android games on the TV."
recommended = true
disable = ["com.google.android.play.games"]

[option.talkback]
section = "bloat"
label = "TalkBack"
reason = "Screen reader that speaks what's on screen. Only needed by blind or low-vision users."
caveat = "Leave this on if anyone in your home relies on it."
recommended = true
disable = ["com.google.android.marvin.talkback"]

[option.print-spooler]
section = "bloat"
label = "Print Spooler"
reason = "Android's printing service. A TV has nothing to print."
recommended = true
disable = ["com.android.printspooler"]

# --- privacy --------------------------------------------------------------------

[option.feedback]
section = "privacy"
label = "Google Feedback"
reason = "The 'send feedback' tool that uploads bug reports and system logs to Google, and the prompt that asks whether to share them."
recommended = true
disable = ["com.google.android.feedback", "com.android.tv.feedbackconsent"]

[option.ad-interests]
section = "privacy"
label = "Ad interest tracking (Privacy Sandbox)"
reason = "Android's on-device ad system. It builds a list of your interests, personalizes ads from what you do, and uses your data to help train Google's ad models."
recommended = true
disable = [
  "com.android.adservices.api",
  "com.android.ondevicepersonalization.services",
  "com.android.federatedcompute.services",
]

[option.location]
section = "privacy"
label = "Location"
reason = "Turns location off. A TV box doesn't move, and apps that need your region use your internet address instead."
recommended = true
set = { "secure/location_mode" = "0" }

# --- display --------------------------------------------------------------------

# No recommendation: it's taste, so tvlean leaves it alone unless you pick one.
[option.screensaver]
section = "display"
label = "Screensaver"
reason = "What the TV shows after it's been idle for a few minutes."

[option.screensaver.value.ambient]
label = "Ambient Mode"
detail = "Google's photo slideshow with recommendations. Downloads photos and suggestions over the network."
stock = true
set = { "secure/screensaver_enabled" = "1", "secure/screensaver_components" = "com.google.android.apps.tv.dreamx/.service.Backdrop" }

[option.screensaver.value.colors]
label = "Simple colors"
detail = "Android's built-in screensaver: slowly shifting colors, nothing downloaded."
requires = ["com.android.dreams.basic"]
if_missing = "Android's basic screensaver isn't on this TV."
set = { "secure/screensaver_enabled" = "1", "secure/screensaver_components" = "com.android.dreams.basic/.Colors" }

[option.screensaver.value.off]
label = "Off"
detail = "No screensaver. The screen stays as it is until the TV goes to sleep."
set = { "secure/screensaver_enabled" = "0" }

[option.animations]
section = "display"
label = "Animation speed"
reason = "How long menus, windows and app switches take to animate. Nothing is turned off; faster just feels snappier."
recommended = "fast"

[option.animations.value.normal]
label = "Normal"
stock = true
set = { "global/window_animation_scale" = "1", "global/transition_animation_scale" = "1", "global/animator_duration_scale" = "1" }

[option.animations.value.fast]
label = "Fast"
detail = "Animations play twice as fast."
set = { "global/window_animation_scale" = "0.5", "global/transition_animation_scale" = "0.5", "global/animator_duration_scale" = "0.5" }

[option.animations.value.off]
label = "Off"
detail = "Screens switch instantly. Some apps' loading animations disappear too."
set = { "global/window_animation_scale" = "0", "global/transition_animation_scale" = "0", "global/animator_duration_scale" = "0" }

# --- launcher -------------------------------------------------------------------

# The safe way to replace the stock launcher on Google TV: leave launcherx enabled
# and let Projectivy intercept the Home button.
[option.projectivy]
section = "launcher"
label = "Projectivy as your home screen"
reason = "Turns on Projectivy Launcher's accessibility service, the Android permission it uses to catch Home button presses. Accessibility services can see what's on screen, so only enable this for an app you trust."
caveat = "Applying presses Home on the TV once to check it worked, which interrupts anything playing."
enable_service = "com.spocky.projengmenu/.services.ProjectivyAccessibilityService"
if_missing = "Install Projectivy Launcher from the Play Store first, then press Refresh."
takes_over_home = true
home_hint = "In Projectivy: Settings > General > turn on 'Override current launcher'."

# --- never touch ----------------------------------------------------------------

[[protected]]
package = "com.google.android.apps.tv.launcherx"
reason = "Disabling it makes setupwraith's RecoveryActivity take over Home. Use a launcher's own Home-override (e.g. Projectivy) instead."

[[protected]]
package = "com.google.android.tungsten.setupwraith"
reason = "Setup wizard; disabling it can leave the device unable to reach a home screen"

[[protected]]
package = "com.google.android.gms"
reason = "Play Services; breaks sign-in, app updates and most apps"

[[protected]]
package = "com.android.vending"
reason = "Play Store; needed to install and update apps"

[[protected]]
package = "com.google.android.katniss"
reason = "Assistant / voice search; the remote's mic button stops working"
