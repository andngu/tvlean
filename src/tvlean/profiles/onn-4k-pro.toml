# onn. Streaming Device 4K pro (Walmart), Google TV, Android 14.
# Every rule here was applied and verified on a real device; see tested_on.

[profile]
id = "onn-4k-pro"
name = "onn. Streaming Device 4K pro"
match_models = ["onn. Streaming Device 4K pro"]
tested_on = ["Android 14, jarvis, 2026-10-18"]
default_groups = ["bloat", "privacy", "speed"]

# --- groups -------------------------------------------------------------------

[groups.bloat]
title = "Unused preinstalled apps"
description = "Turns off apps that ship with the box but that nothing else needs. They disappear from your app list, stop starting in the background and stop auto-updating, which frees up memory."
caveat = "TalkBack is the screen reader. Leave this group off if anyone in your home relies on it."

[groups.streaming]
title = "Preinstalled YouTube and Netflix"
description = "Turns off YouTube and Netflix, which come preinstalled and can't be uninstalled the normal way. They stop running in the background and their rows disappear from the home screen."
caveat = "Only pick this if you don't use them. Undo brings them back still signed in."

[groups.privacy]
title = "Ad tracking and location"
description = "Turns off Android's built-in ad-interest system (Privacy Sandbox), Google's feedback reporter, and location. Apps can no longer ask the system for your ad interests or location."
caveat = "Apps still see your internet address, so region-based apps keep working. To also delete your advertising ID, go to Settings > Privacy > Ads on the TV."

[groups.speed]
title = "Faster animations"
description = "Makes menu and app-switching animations play twice as fast. Nothing is turned off; the TV just feels snappier."
caveat = ""

[groups.launcher]
title = "Projectivy as your home screen"
description = "Lets Projectivy Launcher take over the Home button, replacing the Google TV home screen (and its ads and recommendations) with a lighter one. The Google TV launcher stays installed, just unused."
caveat = "Install Projectivy from the Play Store first. Applying presses Home on the TV once to check it worked, which interrupts anything playing."

# --- packages -----------------------------------------------------------------

[[package]]
package = "com.google.android.play.games"
label = "Play Games"
reason = "Google's game hub and achievements service. Only matters if you play Android games on the TV."
groups = ["bloat"]

[[package]]
package = "com.google.android.marvin.talkback"
label = "TalkBack"
reason = "Screen reader that speaks what's on screen. Only needed by blind or low-vision users."
groups = ["bloat"]

[[package]]
package = "com.android.printspooler"
label = "Print Spooler"
reason = "Android's printing service. A TV has nothing to print."
groups = ["bloat"]

[[package]]
package = "com.google.android.feedback"
label = "Google Feedback"
reason = "The 'send feedback' tool that uploads bug reports and system logs to Google."
groups = ["bloat", "privacy"]

[[package]]
package = "com.android.tv.feedbackconsent"
label = "Feedback consent"
reason = "Asks whether to share feedback with Google. Does nothing once Google Feedback is off."
groups = ["bloat", "privacy"]

[[package]]
package = "com.google.android.youtube.tv"
label = "YouTube"
reason = "Google's YouTube app for TV."
groups = ["streaming"]

[[package]]
package = "com.netflix.ninja"
label = "Netflix"
reason = "The preinstalled Netflix app."
groups = ["streaming"]

[[package]]
package = "com.netflix.tokenmanager"
label = "Netflix sign-in helper"
reason = "Keeps Netflix signed in across resets. Does nothing without the Netflix app."
groups = ["streaming"]

[[package]]
package = "com.android.adservices.api"
label = "Privacy Sandbox ad services"
reason = "Builds a list of your interests on the device so apps can show you targeted ads."
groups = ["privacy"]

[[package]]
package = "com.android.ondevicepersonalization.services"
label = "On-device personalization"
reason = "Personalizes ads and content based on what you do on the device."
groups = ["privacy"]

[[package]]
package = "com.android.federatedcompute.services"
label = "Federated compute"
reason = "Uses your device's data to help train Google's ad and personalization models."
groups = ["privacy"]

# --- settings -----------------------------------------------------------------

[[setting]]
namespace = "secure"
key = "location_mode"
value = "0"
label = "Location"
reason = "Turns location off. A TV box doesn't move, and apps that need your region use your internet address instead."
groups = ["privacy"]

[[setting]]
namespace = "global"
key = "window_animation_scale"
value = "0.5"
label = "Window animations"
reason = "How long windows take to open and close: 1x becomes 0.5x."
groups = ["speed"]

[[setting]]
namespace = "global"
key = "transition_animation_scale"
value = "0.5"
label = "Transition animations"
reason = "How long switching between apps and screens takes: 1x becomes 0.5x."
groups = ["speed"]

[[setting]]
namespace = "global"
key = "animator_duration_scale"
value = "0.5"
label = "In-app animations"
reason = "How long animations inside apps take, such as menus sliding in: 1x becomes 0.5x."
groups = ["speed"]

# --- accessibility services ---------------------------------------------------

# The safe way to replace the stock launcher on Google TV: leave launcherx
# enabled and let Projectivy intercept the Home button.
[[accessibility]]
service = "com.spocky.projengmenu/.services.ProjectivyAccessibilityService"
label = "Projectivy Home-button override"
reason = "Turns on Projectivy's accessibility service, the Android permission it uses to catch Home button presses. Accessibility services can see what's on screen, so only enable this for an app you trust."
groups = ["launcher"]
takes_over_home = true
hint = "In Projectivy: Settings > General > turn on 'Override current launcher'."

# --- never touch --------------------------------------------------------------

[[protected]]
package = "com.google.android.apps.tv.launcherx"
reason = "Disabling it makes setupwraith's RecoveryActivity take over Home. Use a launcher's own Home-override (e.g. Projectivy) instead."

[[protected]]
package = "com.google.android.tungsten.setupwraith"
reason = "Setup wizard; disabling it can leave the device unable to reach a home screen"

[[protected]]
package = "com.google.android.gms"
reason = "Play Services; breaks sign-in, app updates and most apps"

[[protected]]
package = "com.android.vending"
reason = "Play Store; needed to install and update apps"

[[protected]]
package = "com.google.android.katniss"
reason = "Assistant / voice search; the remote's mic button stops working"
