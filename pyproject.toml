[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvlean"
version = "0.1.0"
description = "Safe, reversible cleanup for Google TV / Android TV devices over adb"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tvlean = "tvlean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvlean = ["profiles/*.toml"]
